{% extends "layout.html" %}
{% block content %}
    <table>
        <thead>
            <tr>
                <th>Код</th>
                <th>Название</th>
                <th>Номинал</th>
                <th>Курс</th>
            </tr>
        </thead>
        <tbody>
            {% for currency in currencies %}
            <tr>
                <td>{{ currency.char_code }}</td>
                <td>{{ currency.name }}</td>
                <td>{{ currency.nominal }}</td>
                <td>{{ currency.value }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}

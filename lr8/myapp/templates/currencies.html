{% extends "layout.html" %}
{% block content %}
    <table border="1" style="border-collapse: collapse; width: 100%;">
        <thead>
            <tr>
                <th>ID</th>
                <th>Код</th>
                <th>Название</th>
                <th>Курс</th>
                <th>Номинал</th>
                <th>Действия</th> </tr>
        </thead>
        <tbody>
            {% for currency in currencies %}
            <tr>
                <td>{{ currency.id }}</td>
                <td>{{ currency.char_code }}</td>
                <td>{{ currency.name }}</td>
                <td>{{ currency.value }}</td>
                <td>{{ currency.nominal }}</td>
                <td>
                    <a href="/currency/delete?id={{ currency.id }}" 
                       style="color: red;">Удалить</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
